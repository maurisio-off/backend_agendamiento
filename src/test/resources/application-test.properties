# Base de datos H2 en memoria para las pruebas (no necesita MySQL encendido)
spring.datasource.url=jdbc:h2:mem:agendamiento_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# URLs de los otros microservicios (en las pruebas no se llaman de verdad)
servicios.usuarios.url=http://localhost:8081
servicios.catalogo.url=http://localhost:8082
