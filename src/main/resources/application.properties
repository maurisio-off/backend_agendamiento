spring.application.name=backend_agendamiento
server.port=${SERVER_PORT:8083}

# Base de datos MySQL (usa las variables de Docker en EC2; si no existen, usa el MySQL local de XAMPP)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inmobiliaria_agendamiento?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agendamiento}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agendamiento_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# URLs de los otros microservicios (Usuarios y Catálogo)
servicios.usuarios.url=${SERVICIOS_USUARIOS_URL:http://localhost:8081}
servicios.catalogo.url=${SERVICIOS_CATALOGO_URL:http://localhost:8082}

# CORS: orígenes del front que pueden llamar a esta API, separados por coma (S3 y desarrollo local)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
