spring.application.name=backend_agendamiento
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/inmobiliaria_agendamiento?serverTimezone=America/Santiago
spring.datasource.username=agendamiento
spring.datasource.password=${DB_PASSWORD:agendamiento_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#  microservicios usuarios y catálogo
servicios.usuarios.url=http://localhost:8081
servicios.catalogo.url=http://localhost:8082

# CORS, orígenes del front que pueden llamar a esta API (separados por coma)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000