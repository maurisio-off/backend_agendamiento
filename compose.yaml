services:
  mysql-agendamiento:
    image: mysql:8.4
    container_name: mysql-agendamiento
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - mysql_agendamiento_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-agendamiento:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-agendamiento
    restart: unless-stopped
    depends_on:
      mysql-agendamiento:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-agendamiento:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SERVICIOS_USUARIOS_URL: ${SERVICIOS_USUARIOS_URL}
      SERVICIOS_CATALOGO_URL: ${SERVICIOS_CATALOGO_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}

volumes:
  mysql_agendamiento_data:
